<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>Bốn mùa</title>
    <style>
        :root {
            --mau-nen: #FFFDE7;
            --mau-vien: #9E9E9E;
            --mau-tieu-de: #D40000;
            --mau-nen-tieu-de: #FFD9E6;
            --mau-xanh: #0033CC;
            --mau-do: #D40000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .khung-tho {
            background-color: var(--mau-nen);
            border: 1px solid var(--mau-vien);
            width: 640px;
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: var(--mau-tieu-de);
            background-color: var(--mau-nen-tieu-de);
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px;
        }

        p {
            font-style: italic;
            line-height: 1.7;
        }

        p.kho-xanh {
            color: var(--mau-xanh);
        }

        p.kho-do {
            color: var(--mau-do);
        }

        hr {
            width: 55%;
            border: none;
            border-top: 1px solid var(--mau-xanh);
        }
    </style>
</head>

<body>
    <article class="khung-tho">
        <h1>BỐN MÙA</h1>
        <p class="kho-xanh">Xuân về hoa nở khắp trời
            <br>Hạ sang nắng cháy rạng ngời phố quen
            <br>Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">Đông sang gió lạnh bên em đợi chờ
            <br>Bốn mùa là bốn giấc mơ
            <br>Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho-xanh">Một năm rồi lại một năm
            <br>Vẫn còn câu hát thì thầm quê hương
            <br>Chờ xuân nắng mới soi đường
        </p>
    </article>
</body>

</html>
